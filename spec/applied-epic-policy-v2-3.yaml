      summary: Get Producer Broker Commission by ID
      description: Retrieve a single or multi term producer broker commission
      tags:
        - Producer Broker Commissions
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ProducerBrokerCommissionDetail'
              examples:
                ProducerBrokerCommissionWithoutEmbedsResponseExample:
                  $ref: '#/components/examples/ProducerBrokerCommissionWithoutEmbedsResponseExample'
                ProducerBrokerCommissionWithEmbedsResponseExample:
                  $ref: '#/components/examples/ProducerBrokerCommissionWithEmbedsResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get-producer-broker-commissions-producerBrokerCommissionId
      parameters:
        - $ref: '#/components/parameters/ClientCorrelationId'
        - $ref: '#/components/parameters/CultureCode'
        - name: embed
          description: Optionally add related resources to the embedded property of the response.
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - organization
                - commissionAgreement
                - payableContract
                - account
      security:
        - oAuth:
            - 'epic/producer-broker-commissions:read'
            - 'epic/producer-broker-commissions:all'
