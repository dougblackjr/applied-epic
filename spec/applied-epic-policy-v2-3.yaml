openapi: 3.0.3
info:
  title: Policies
  version: '2.0.1'
  description: Manage core policy and plan information for Property & Casualty and Benefits
servers:
  - url: 'https://api.mock.myappliedproducts.com/epic/policy/v2'
tags:
  - name: Policies
    description: Operations related to policies
  - name: Lines
    description: Operations related to policy lines
  - name: Policy Sources
    description: Operations related to policy sources
  - name: Policy Statuses
    description: Operations related to policy statuses
  - name: Producer Broker Commissions
    description: Operations related to commissions payable to producers and brokers
  - name: Policy Types
    description: Operations related to policy types
  - name: Servicing Roles
    description: Operations related to line servicing roles
paths:
  /statuses:
    get:
      summary: Get Policy Statuses
      operationId: get-policy-statuses
      description: Get a filtered list of policy statuses. This method requires version Fall 2022 of Epic or later to be utilized.
      tags:
        - Policy Statuses
      parameters:
        - $ref: '#/components/parameters/CultureCode'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - schema:
            type: string
            default: active
            example: 'active,inactive'
          in: query
          name: isActive_status
          description: Filters policy statuses by active status. Defaults to active only if not specified. Both values may be supplied to get all policy statuses.
          style: form
          explode: false
        - schema:
            type: string
          in: query
          name: search
          description: Finds policy statuses that contain the search text in either the code or description
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HALcollection'
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          statuses:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/PolicyStatus'
                                - $ref: '#/components/schemas/HALobject'
              examples:
                ListPolicyStatuses:
                  $ref: '#/components/examples/getPolicyStatusesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
      security:
        - oAuth:
            - 'epic/policy-statuses:read'
            - 'epic/policy-statuses:all'
    parameters: []
  '/statuses/{statusId}':
    parameters:
      - schema:
          type: string
        name: statusId
        in: path
        required: true
        description: The unique identifier of the policy status
    get:
      summary: Get Policy Status by ID
      operationId: get-policy-status-by-id
      description: Retrieve a single policy status by its unique identifier. This method requires version Fall 2022 of Epic or later to be utilized.
      tags:
        - Policy Statuses
      parameters:
        - $ref: '#/components/parameters/CultureCode'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PolicyStatus'
                  - $ref: '#/components/schemas/HALobject'
              examples:
                GetPolicyStatusById:
                  $ref: '#/components/examples/getPolicyStatusByIdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
      security:
        - oAuth:
            - 'epic/policy-statuses:read'
            - 'epic/policy-statuses:all'
  '/policies/{policyId}':
    parameters:
      - schema:
          type: string
          format: uuid
        name: policyId
        in: path
        required: true
        description: The unique identifier of the policy
    get:
      summary: Get Policy by Policy ID
      description: Retrieve a single policy by its unique identifier. This method requires version May 2026 of Epic or later to be utilized.
      tags:
        - Policies
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Policy'
              examples:
                PolicyWithoutEmbedsResponseExample:
                  $ref: '#/components/examples/PolicyWithoutEmbedsResponseExample'
                PolicyWithEmbedsResponseExample:
                  $ref: '#/components/examples/PolicyWithEmbedsResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
      operationId: get-policies-policyId
      parameters:
        - $ref: '#/components/parameters/CultureCode'
        - name: embed
          description: Optionally add related resources to the embedded property of the policy response.
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - client
                - source
                - organization
                - policyType
                - lines
      security:
        - oAuth:
            - 'epic/policies:read'
            - 'epic/policies:all'
  /lines:
    post:
      summary: Create Line
      description: Create a new line
      tags:
        - Lines
      responses:
        '201':
          description: Created
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Line'
              examples:
                LineWithoutEmbedsResponseExample:
                  $ref: '#/components/examples/LineWithoutEmbedsResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
      operationId: post-lines
      requestBody:
        content:
          application/hal+json:
            schema:
              $ref: '#/components/schemas/Line'
            examples:
              CreateLine:
                $ref: '#/components/examples/CreateLineRequest'
              CreateLineOnlyRequired:
                $ref: '#/components/examples/CreateLineRequestOnlyRequired'
      security:
        - oAuth:
            - 'epic/lines:create'
            - 'epic/lines:all'
    get:
      summary: Get Lines
      operationId: get-lines
      description: Get a filtered list of lines
      tags:
        - Lines
      parameters:
        - $ref: '#/components/parameters/CultureCode'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - schema:
            type: string
            format: uuid
          in: query
          name: policy
          description: Filters lines by policy identifier
        - schema:
            type: string
            format: date-time
          in: query
          name: lastUpdatedOn.date_before
          description: Filters lines with a last updated date before the specified date
        - schema:
            type: string
            format: date-time
          in: query
          name: lastUpdatedOn.date_after
          description: Filters lines with a last updated date after the specified date
        - schema:
            type: string
          in: query
          name: lineType.code
          description: Filters lines by line type code that exactly matches the specified value
        - schema:
            type: string
          in: query
          name: lineType.code_contains
          description: Filters lines by line type code containing the specified value
        - schema:
            type: string
            format: date
          in: query
          name: effectiveOn
          description: Filters lines that have the exact effective date specified
        - schema:
            type: string
            format: date
          in: query
          name: effectiveOn_before
          description: Filters lines with an effective date before the specified date
        - schema:
            type: string
            format: date
          in: query
          name: effectiveOn_after
          description: Filters lines with an effective date after the specified date
        - schema:
            type: string
            format: date
          in: query
          name: expirationOn
          description: Filters lines that have the exact expiration date specified
        - schema:
            type: string
            format: date
          in: query
          name: expirationOn_before
          description: Filters lines with an expiration date before the specified date
        - schema:
            type: string
            format: date
          in: query
          name: expirationOn_after
          description: Filters lines with an expiration date after the specified date
        - schema:
            type: array
            items:
              type: string
              format: uuid
          in: query
          description: Filter lines by organization
          name: organization
        - schema:
            type: string
            format: uuid
          in: query
          name: client
          description: Filters lines by client identifier
        - schema:
            type: array
            items:
              type: string
              enum:
                - client
                - policy
                - status
                - organization
                - lineType
                - issuingCompany
                - premiumPayable
                - commissionAgreement
          in: query
          name: embed
          description: Specify sub-resources to embed
          style: form
          explode: false
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HALcollection'
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          lines:
                            type: array
                            items:
                              allOf:
                                - type: object
                                  description: Summary information for a line
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                      description: The unique identifier of the line
                                      readOnly: true
                                    client:
                                      type: string
                                      format: uuid
                                      description: Identifier of the client associated with this line
                                    policy:
                                      type: string
                                      format: uuid
                                      description: Identifier of the policy that this line belongs to
                                    lineType:
                                      type: string
                                      format: uuid
                                      description: Line type identifier
                                    planOptionName:
                                      type: string
                                      description: The plan option name
                                      maxLength: 100
                                    status:
                                      type: string
                                      format: uuid
                                      description: Policy status identifier
                                    effectiveOn:
                                      type: string
                                      format: date
                                      description: Date the line is effective from
                                    expirationOn:
                                      type: string
                                      format: date
                                      description: Date the line expires
                                    organization:
                                      type: string
                                      format: uuid
                                      description: Organization identifier
                                    billMode:
                                      type: string
                                      description: The bill mode for the line
                                      enum:
                                        - AGENCY
                                        - DIRECT
                                    issuingLocation:
                                      type: object
                                      description: Issuing location information
                                      required:
                                        - stateOrProvince
                                        - country
                                      properties:
                                        stateOrProvince:
                                          type: string
                                          description: The state or province code of the issuing location. This field will leverage ISO 3166-2 state code format (NY, ON)
                                          maxLength: 2
                                        country:
                                          type: string
                                          description: The country code of the issuing location. This field will leverage ISO 3166-1 alpha-3 code format (USA, CAN, GBR)
                                          maxLength: 3
                                    issuingCompany:
                                      type: string
                                      format: uuid
                                      description: Issuing company identifier
                                    premiumPayable:
                                      type: object
                                      description: Premium payable information
                                      nullable: true
                                      properties:
                                        account:
                                          type: string
                                          format: uuid
                                          description: Company or Broker Identifier for the premium payable
                                        type:
                                          type: string
                                          enum:
                                            - EXTERNAL_BROKER
                                            - CARRIER
                                            - INTERNAL_BROKER
                                          description: Premium payable entity type
                                    producerBrokerCommission:
                                      type: object
                                      description: Indicator if the producer broker commissions align with the policy term or are broken into multiple terms
                                      nullable: true
                                      properties:
                                        type:
                                          type: string
                                          description: Type of producer broker commission structure
                                          enum:
                                            - SINGLE_TERM
                                            - MULTI_TERM
                                            - MULTI_COMMISSION
                                            - MULTI_CARRIER
                                    planLineId:
                                      type: string
                                      description: The identifier of the plan line
                                      maxLength: 25
                                    rateGuaranteedThrough:
                                      type: string
                                      format: date
                                      description: Date through which the current rate or premium is guaranteed not to change
                                    lineCommission:
                                      type: object
                                      description: Line commission information
                                      properties:
                                        useAgreement:
                                          type: boolean
                                          description: Indicates whether a commission agreement is used for this line
                                        commissionAgreement:
                                          type: string
                                          format: uuid
                                          description: Identifier of the commission agreement applied to this line
                                        overrideAgreement:
                                          type: boolean
                                          description: Indicates whether this line overrides the default commission agreement
                                        type:
                                          type: string
                                          description: Identifies how commission is calculated
                                          enum:
                                            - FLAT_FEE
                                            - PERCENTAGE_OF_PREMIUM
                                        percent:
                                          type: number
                                          format: double
                                          description: Commission percentage applied to premium (if type is PERCENTAGE_OF_PREMIUM)
                                        amount:
                                          allOf:
                                            - $ref: '#/components/schemas/Currency'
                                            - description: Commission amount for this line (if type is FLAT_FEE or as a calculated value)
                                    stage:
                                      type: string
                                      description: Current service status based on the latest service summary record
                                      enum:
                                        - NOT_APPLICABLE
                                        - NOT_SUBMITTED
                                        - CANCELLED
                                        - ISSUED
                                        - LAPSED
                                        - MIGRATED
                                        - NOT_ISSUED
                                        - IN_PROCESS
                                        - SUBMITTED
                                        - SUSPENDED
                                        - LAPSE_REVOKED
                                        - NOT_RECEIVED
                                    action:
                                      type: string
                                      description: Most recent service action based on the latest service summary record
                                      enum:
                                        - ADD_ON
                                        - CANCEL
                                        - ENDORSE_REVISE
                                        - FUTURE_MTA_REVOKED
                                        - REINSTATE
                                        - LAPSE
                                        - MTA
                                        - NEW
                                        - RENEW
                                        - SERVICE_POLICY
                                        - TEMP_MTA
                                - $ref: '#/components/schemas/HALobject'
                                - type: object
                                  properties:
                                    _embedded:
                                      type: object
                                      properties:
                                        client:
                                          $ref: '#/components/schemas/Client_Embed'
                                        policy:
                                          $ref: '#/components/schemas/Policy_Embed'
                                        status:
                                          $ref: '#/components/schemas/Status_Embed'
                                        organization:
                                          $ref: '#/components/schemas/Organization_Embed'
                                        lineType:
                                          $ref: '#/components/schemas/PolicyType_Embed'
                                        issuingCompany:
                                          $ref: '#/components/schemas/IssuingCompany_Embed'
                                        premiumPayable:
                                          $ref: '#/components/schemas/PremiumPayable_Embed'
                                        commissionAgreement:
                                          $ref: '#/components/schemas/CommissionAgreement_Embed'
              examples:
                LinesWithoutEmbedsExample:
                  $ref: '#/components/examples/GetLinesWithoutEmbedsResponse'
                LinesWithEmbedsExample:
                  $ref: '#/components/examples/GetLinesWithEmbedsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - oAuth:
            - 'epic/lines:read'
            - 'epic/lines:all'
    parameters: []
  '/lines/{lineId}':
    parameters:
      - schema:
          type: string
        name: lineId
        in: path
        required: true
        description: The unique identifier of the line
    get:
      summary: Get Line by Line ID
      description: Retrieve a single line.
      tags:
        - Lines
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Line'
              examples:
                LineWithoutEmbedsResponseExample:
                  $ref: '#/components/examples/LineWithoutEmbedsResponseExample'
                LineWithExternalBrokerAndEmbedsResponseExample:
                  $ref: '#/components/examples/LineWithExternalBrokerAndEmbedsResponseExample'
                LineWithInternalBrokerAndEmbedsResponseExample:
                  $ref: '#/components/examples/LineWithInternalBrokerAndEmbedsResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
      operationId: get-lines-lineId
      parameters:
        - $ref: '#/components/parameters/ClientCorrelationId'
        - $ref: '#/components/parameters/CultureCode'
        - name: embed
          description: Optionally add related resources to the embedded property of the line response.
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - client
                - policy
                - status
                - lineType
                - issuingCompany
                - premiumPayable
                - commissionAgreement
                - payableContract
                - organization
                - account
      security:
        - oAuth:
            - 'epic/lines:read'
            - 'epic/lines:all'
  '/lines/{lineId}/producer-broker-commissions':
    parameters:
      - schema:
          type: string
        name: lineId
        in: path
        required: true
        description: The unique identifier for the line to get producer broker commissions for
    get:
      summary: Get Producer Broker Commission by Line
      description: Retrieve producer broker commission information for a line
      tags:
        - Producer Broker Commissions
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                title: Producer Broker Commission
                description: Producer or broker commission information for a line
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - SINGLE_TERM
                      - MULTI_TERM
                  schedules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: integer
                          description: The order number of the schedule.  For a single term, the schedule will be 1
                          readOnly: true
                        startOn:
                          type: string
                          format: date
                          description: The start date for the producer broker commission term
                        endOn:
                          type: string
                          format: date
                          description: The end date for the producer broker commission term
                        description:
                          type: string
                          maxLength: 100
                          description: The details for the term.  For single term commissions, this will be empty
                        producerBrokerCommissions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: The unique identifier for the producer broker commission
                              producerBroker:
                                type: object
                                description: Producer or broker information
                                properties:
                                  type:
                                    type: string
                                    description: Indicator if this commission will be paid to a producer, paid to broker or is broker receivable
                                    enum:
                                      - PRODUCER_PAYABLE
                                      - BROKER_PAYABLE
                                      - BROKER_RECEIVABLE
                                  account:
                                    type: string
                                    format: uuid
                                    description: The unique identifier for the producer or broker that will be paid the commission
                              useCommissionAgreement:
                                type: boolean
                                description: Whether the commission should be calculated using a predefined commission agreement or a custom one
                              commissionAgreement:
                                type: string
                                format: uuid
                                description: The unique identifier of the commission agreement to use. This value must be provided if useCommissionAgreement is true
                              overrideCommissionAgreement:
                                type: boolean
                                description: Determines if the commission agreement's value can be overridden. This value must be provided if useCommissionAgreement is true
                                nullable: true
                              payableContract:
                                type: string
                                format: uuid
                                description: The unique identifier for the payable contract to use in this agreement. The policy effective date must fall in the contract range, and organizations must align with the policy and producer. The contract type must be Premium\Commission Payable or Commission Payable House Producers cannot have payable contracts, this field must be empty in that case
                              commissionType:
                                type: string
                                description: Indicator of how the commission will be calculated. NET_BROKERAGE_COMMISSION_SPLIT is only valid when the producerBroker type is set to PRODUCER
                                enum:
                                  - FLAT_FEE
                                  - PERCENTAGE_OF_PREMIUM
                                  - PERCENTAGE_OF_COMMISSION
                                  - NET_BROKERAGE_COMMISSION_SPLIT
                                  - BROKERAGE_NET_COMMISSION
                              commissionPercent:
                                type: number
                                format: double
                                nullable: true
                                description: The percentage rate offered for calculating the commission. This value must be provided when the commissionType is set to PERCENTAGE_OF_COMMISSION, BROKERAGE_NET_COMMISSION, NET_BROKERAGE_COMMISSION_SPLIT, or PERCENTAGE_OF_PREMIUM. This value must be null when the producer is a House Producer and has Shared Revenue enabled
                              commissionAmount:
                                type: object
                                nullable: true
                                description: The amount of commission offered. This value must be provided when the commissionType is set to FLAT_FEE. This value must be null when the producer is a House Producer and has Shared Revenue enabled
                                properties:
                                  allOf:
                                    $ref: '#/components/schemas/Currency'
                              productionCredit:
                                type: number
                                format: double
                                description: The percentage of production credit assigned to the account
                              orderNumber:
                                type: number
                                format: int32
                                description: The order for the producer or broker in the line, influencing payment for BROKERAGE_NET_COMMISSION commissions
                              sharedRevenue:
                                type: object
                                nullable: true
                                description: Automatically split revenue among organizations when accounts are serviced by multiple agencies or offices. Must be null if share revenue is disabled in policy system settings, for brokers, and for employees without share revenue enabled
                                properties:
                                  percent:
                                    type: number
                                    format: double
                                    description: The percentage of revenue to share with another organization
                                  organization:
                                    type: string
                                    format: uuid
                                    description: An organization that falls into the valid primary office options for the producer
                              commission:
                                type: object
                                description: Commission information
                                readOnly: true
                                properties:
                                  billed:
                                    allOf:
                                      - $ref: '#/components/schemas/Currency'
                                      - type: object
                                        nullable: true
                                        description: Total commission actually billed so far
                                  annualized:
                                    allOf:
                                      - $ref: '#/components/schemas/Currency'
                                      - type: object
                                        nullable: true
                                        description: Commission normalized to a 12-month period
                                  estimated:
                                    allOf:
                                      - $ref: '#/components/schemas/Currency'
                                      - type: object
                                        nullable: true
                                        description: Estimated total commission for the current term
                              _links:
                                properties:
                                  self:
                                    $ref: '#/components/schemas/HALlink'
                                  organization:
                                    $ref: '#/components/schemas/HALlink'
                                  commissionAgreement:
                                    $ref: '#/components/schemas/HALlink'
                                  payableContract:
                                    $ref: '#/components/schemas/HALlink'
                                  account:
                                    $ref: '#/components/schemas/HALlink'
                              _embedded:
                                properties:
                                  organization:
                                    $ref: '#/components/schemas/Organization_Embed'
                                  commissionAgreement:
                                    $ref: '#/components/schemas/ProducerBrokerCommissionAgreement_Embed'
                                  payableContract:
                                    $ref: '#/components/schemas/PayableContract_Embed'
                                  account:
                                    $ref: '#/components/schemas/ProducerBrokerAccount_Embed'
              examples:
                ProducerBrokerCommissionDetailWithoutEmbedsResponseExample:
                  $ref: '#/components/examples/ProducerBrokerCommissionDetailWithoutEmbedsResponseExample'
                ProducerBrokerCommissionDetailWithEmbedsResponseExample:
                  $ref: '#/components/examples/ProducerBrokerCommissionDetailWithEmbedsResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get-lines-lineId-producer-broker-commissions
      parameters:
        - $ref: '#/components/parameters/ClientCorrelationId'
        - $ref: '#/components/parameters/CultureCode'
        - name: embed
          description: Optionally add related resources to the embedded property of the response.
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - organization
                - commissionAgreement
                - payableContract
                - account
      security:
        - oAuth:
            - 'epic/producer-broker-commissions:read'
            - 'epic/producer-broker-commissions:all'
  /types:
    get:
      summary: Get Policy Types
      operationId: get-policy-types
      description: Get a filtered list of policy types
      tags:
        - Policy Types
      parameters:
        - $ref: '#/components/parameters/CultureCode'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - schema:
            type: array
            items:
              type: string
              enum:
                - department
                - profitCenter
                - formCategory
          in: query
          name: embed
          description: Specify sub-resources to embed.
          style: form
          explode: false
        - schema:
            type: string
            enum:
              - AGRICULTURE
              - BENEFITS
              - BONDS
              - COMMERCIAL
              - FINANCIAL_SERVICES
              - LIFE_AND_HEALTH
              - OTHER
              - PERSONAL
          in: query
          name: businessType
          description: Filters policy types by business type
        - schema:
            type: array
            items:
              type: string
              enum:
                - ACORD
