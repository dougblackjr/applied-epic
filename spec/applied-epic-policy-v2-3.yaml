  /policies:
    get:
      summary: List Policies
      operationId: get-policies-list
      description: Retrieve a filtered list of policies. This method requires version July 2023 of Epic or later to be utilized.
      tags:
        - Policies
      parameters:
        - $ref: '#/components/parameters/CultureCode'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - schema:
            type: string
          in: query
          description: Filter on a specific policy/line type id
          name: policyType
        - schema:
            type: string
          in: query
          name: policyType.code
          description: Filter on a specific policy/line type code
        - schema:
            type: string
          in: query
          name: policyType.code_contains
          description: Finds policies that contain this policy/line type code
        - schema:
            type: string
          in: query
          name: policyNumber
          description: Finds policies that exactly match the given policy number. Searches both the policy's current policy number and any extended/alternate policy numbers.
        - schema:
            type: string
          in: query
          name: policyNumber_contains
          description: Finds policies that contain the provided value in the policy number. Searches both the policy's current policy number and any extended/alternate policy numbers.
        - schema:
            type: string
            format: date
          in: query
          name: effectiveOn
          description: Finds policies that have an effective date that exactly matches the provided value.
        - schema:
            type: string
            format: date
          in: query
          name: effectiveOn_before
          description: Finds policies that have an effective date before the provided value.
        - schema:
            type: string
            format: date
          in: query
          name: effectiveOn_after
          description: Finds policies that have an effective date after the provided value.
        - schema:
            type: string
            format: date
          in: query
          name: expirationOn
          description: Finds policies that have an expiration date that exactly matches the provided value.
        - schema:
            type: string
            format: date
          in: query
          name: expirationOn_before
          description: Finds policies that have an expiration date before the provided value.
        - schema:
            type: string
            format: date
          in: query
          name: expirationOn_after
          description: Finds policies that have an expiration date after the provided value.
        - schema:
            type: string
            format: date
          in: query
          name: enteredBy.date_before
          description: Finds policies that were entered before a specific date.
        - schema:
            type: string
            format: date
          in: query
          name: enteredBy.date_after
          description: Finds policies that were entered after a specific date.
        - schema:
            type: string
            format: date-time
          in: query
          name: lastUpdatedBy.date_before
          description: Finds policies that were last updated before a specific date.
        - schema:
            type: string
            format: date-time
          in: query
          name: lastUpdatedBy.date_after
          description: Finds policies that were last updated after a specific date.
        - schema:
            type: string
            default: CURRENT
          example: CURRENT,HISTORIC
          in: query
          name: historic_status
          description: Finds policies by their historic status. Multiple values should be comma separated.
        - schema:
            type: array
            items:
              type: string
              enum:
                - AGRICULTURE
                - BENEFITS
                - BONDS
                - COMMERCIAL
                - FINANCIAL_SERVICES
                - LIFE_AND_HEALTH
                - OTHER
                - PERSONAL
          in: query
          name: policyType.businessType
          description: Finds policies by matching the type of business assigned to the type of policy.
          style: form
          explode: false
        - schema:
            type: string
            enum:
              - PROSPECTIVE
              - CONTRACTED
          in: query
          name: status
          description: Finds policies by matching the policy status exactly. Multiple values should be comma separated.
        - schema:
            type: string
            format: uuid
          in: query
          name: client
          description: Finds policies that belong to a clientID that exactly matches the provided value.
        - schema:
            type: string
          in: query
          name: enteredByProcess.code
          description: Finds policies that have an inserted process code that exactly matches the provided value.
        - schema:
            type: string
          in: query
          name: lastUpdatedByProcess.code
          description: Finds policies that have an updated process code that exactly matches the provided value.
        - schema:
            type: string
            format: uuid
          in: query
          name: originalPolicy
          description: Finds policies that have an original policy ID that exactly matches the provided value.
        - name: embed
          description: Optionally add related resources to the embedded property of the policy list response.
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - client
                - source
                - organization
                - policyType
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HALcollection'
                  - type: object
                properties:
                  _embedded:
                    type: object
                    properties:
                      policies:
                        type: array
                        items:
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The unique identifier of the policy
                              readOnly: true
                            status:
                              type: string
                              description: Indicator of the high level status of the policy
                              enum:
                                - PROSPECTIVE
                                - CONTRACTED
                            organization:
                              type: string
                              format: uuid
                              description: Organizational assignment of the policy (agency/branch/department) up to department level
                            description:
                              type: string
                              description: Short description of this policy
                              maxLength: 125
                            effectiveOn:
                              type: string
                              format: date
                              description: Date when coverage for this policy becomes effective
                            expirationOn:
                              type: string
                              format: date
                              description: Date when coverage for this policy ends
                            policyNumber:
                              type: string
                              description: Policy number as recorded on the policy
                              maxLength: 25
                            policyType:
                              type: string
                              format: uuid
                              description: Unique identifier for the policy type (for example, Commercial Auto, Property, Benefits)
                            client:
                              type: string
                              format: uuid
                              description: Unique identifier of the client
                            premium:
                              type: object
                              description: The total amount of money charged to the policyholder for insurance coverage over a specified term
                              properties:
                                estimated:
                                  allOf:
                                    - $ref: '#/components/schemas/Currency'
                                    - description: The estimated total premium for this policy for the full term
                                annualized:
                                  allOf:
                                    - $ref: '#/components/schemas/Currency'
                                    - description: The premium for this policy expressed as an annual amount
                                billed:
                                  allOf:
                                    - $ref: '#/components/schemas/Currency'
                                    - description: The premium that has actually been billed/recognized for this policy as of the last update
                                estimatedMonthly:
                                  allOf:
                                    - $ref: '#/components/schemas/Currency'
                                    - description: Estimated monthly policy premium based on current quote details
                                      readOnly: true
                            commission:
                              type: object
                              description: The amount (or set of amounts) payable to an intermediary (agent, broker, or other producer) as compensation for placing or servicing the policy
                              properties:
                                estimated:
                                  allOf:
                                    - $ref: '#/components/schemas/Currency'
                                    - description: The estimated total commission for this policy for the full term
                                annualized:
                                  allOf:
                                    - $ref: '#/components/schemas/Currency'
                                    - description: The commission for this policy expressed as an annual amount
                                billed:
                                  allOf:
                                    - $ref: '#/components/schemas/Currency'
                                    - description: The commission that has actually been billed/recognized for this policy
                                estimatedMonthly:
                                  allOf:
                                    - $ref: '#/components/schemas/Currency'
                                    - description: Estimated monthly commission amount payable to the producer, derived from the estimated monthly premium and applicable commission rules
                                      readOnly: true
                            source:
                              type: string
                              format: uuid
                              description: Identifier for the policy source (for example, referral partner, lead source, integration)
                            originalPolicy:
                              type: string
                              format: uuid
                              description: Unique identifier (GUID) of the original policy from which this policy was created (for example, via renewal)
                            historic:
                              type: boolean
                              description: Indicates that the policy is considered historical (e.g., expired/inactive) based on its expiration date
                            enteredBy:
                              $ref: '#/components/schemas/UserAndDate'
                            lastUpdatedBy:
                              $ref: '#/components/schemas/UserAndDate'
                            enteredByProcess:
                              $ref: '#/components/schemas/ProcessAndDate'
                            lastUpdatedByProcess:
                              $ref: '#/components/schemas/ProcessAndDate'
                            _embedded:
                              type: object
                              description: A set of related resources often embedded in Policy resources.
                              properties:
                                client:
                                  $ref: '#/components/schemas/Client_Embed'
                                source:
                                  $ref: '#/components/schemas/PolicySource_Embed'
                                organization:
                                  title: Organization Embed providing Epic structure information.
                                  description: Organization through Agency, Branch and Department.
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                      description: Unique identifier of the organization this policy is associated with
                                    agency:
                                      type: string
                                      format: uuid
                                      description: Unique identifier for the agency
                                    branch:
                                      type: string
                                      format: uuid
                                      description: Unique identifier for the branch
                                    department:
                                      type: string
                                      format: uuid
                                      description: Unique identifier for the department
                                    _links:
                                      type: object
                                      properties:
                                        self:
                                          type: object
                                          properties:
                                            href:
                                              type: string
                                              format: uri
                                              description: Link to the organization resource
                                        agency:
                                          type: object
                                          properties:
                                            href:
                                              type: string
                                              format: uri
                                              description: Link to the agency resource
                                        branch:
                                          type: object
                                          properties:
                                            href:
                                              type: string
                                              format: uri
                                              description: Link to the branch resource
                                        department:
                                          type: object
                                          properties:
                                            href:
                                              type: string
                                              format: uri
                                              description: Link to the department resource
                                    _embedded:
                                      type: object
                                      description: Embedded organization resources
                                      properties:
                                        agency:
                                          type: object
                                          description: Embedded agency information
                                          properties:
                                            id:
                                              type: string
                                              format: uuid
                                              description: Unique identifier for the agency
                                            name:
                                              type: string
                                              description: Agency name
                                              maxLength: 100
                                            code:
                                              type: string
                                              description: Agency code
                                              maxLength: 3
                                            _links:
                                              type: object
                                              properties:
                                                self:
                                                  type: object
                                                  properties:
                                                    href:
                                                      type: string
                                                      format: uri
                                                      description: Link to the agency resource
                                        branch:
                                          type: object
                                          description: Embedded branch information
                                          properties:
                                            id:
                                              type: string
                                              format: uuid
                                              description: Unique identifier for the branch
                                            name:
                                              type: string
                                              description: Branch name
                                              maxLength: 100
                                            code:
                                              type: string
                                              description: Branch code
                                              maxLength: 3
                                            _links:
                                              type: object
                                              properties:
                                                self:
                                                  type: object
                                                  properties:
                                                    href:
                                                      type: string
                                                      format: uri
                                                      description: Link to the branch resource
                                        department:
                                          type: object
                                          description: Embedded department information
                                          properties:
                                            id:
                                              type: string
                                              format: uuid
                                              description: Unique identifier for the department
                                            name:
                                              type: string
                                              description: Department name
                                              maxLength: 100
                                            code:
                                              type: string
                                              description: Department code
                                              maxLength: 3
                                            _links:
                                              type: object
                                              properties:
                                                self:
                                                  type: object
                                                  properties:
                                                    href:
                                                      type: string
                                                      format: uri
                                                      description: Link to the department resource
                                policyType:
                                  $ref: '#/components/schemas/PolicyType_Embed'
                            _links:
                              type: object
                              description: A set of links often associated with a Policy resource.
                              properties:
                                self:
                                  $ref: '#/components/schemas/HALlink'
                                client:
                                  $ref: '#/components/schemas/HALlink'
                                organization:
                                  $ref: '#/components/schemas/HALlink'
                                policyType:
                                  $ref: '#/components/schemas/HALlink'
              examples:
                ListPoliciesWithoutEmbedsResponseExample:
                  $ref: '#/components/examples/ListPoliciesWithoutEmbedsResponseExample'
                ListPoliciesWithEmbedsResponseExample:
                  $ref: '#/components/examples/ListPoliciesWithEmbedsResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
