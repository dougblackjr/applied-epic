            - PERCENTAGE_OF_COMMISSION
            - NET_BROKERAGE_COMMISSION_SPLIT
            - BROKERAGE_NET_COMMISSION
        commissionPercent:
          type: number
          format: double
          nullable: true
          description: The percentage rate offered for calculating the commission. This value must be provided when the commissionType is set to PERCENTAGE_OF_COMMISSION, BROKERAGE_NET_COMMISSION, NET_BROKERAGE_COMMISSION_SPLIT, or PERCENTAGE_OF_PREMIUM. This value must be null when the producer is a House Producer and has Shared Revenue enabled
        commissionAmount:
          allOf:
            - $ref: '#/components/schemas/Currency'
            - type: object
              nullable: true
              description: The amount of commission offered. This value must be provided when the commissionType is set to FLAT_FEE. This value must be null when the producer is a House Producer and has Shared Revenue enabled
        productionCredit:
          type: number
          format: double
          description: The percentage of production credit assigned to the account
        orderNumber:
          type: number
          format: int32
          description: The order for the producer or broker in the line, influencing payment for BROKERAGE_NET_COMMISSION commissions
        sharedRevenue:
          type: object
          nullable: true
          description: Automatically split revenue among organizations when accounts are serviced by multiple agencies or offices. Must be null if share revenue is disabled in policy system settings, for brokers, and for employees without share revenue enabled
          properties:
            percent:
              type: number
              format: double
              description: The percentage of revenue to share with another organization
            organization:
              type: string
              format: uuid
              description: An organization that falls into the valid primary office options for the producer
        commission:
          type: object
          description: Commission information
          nullable: true
          readOnly: true
          properties:
            billed:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - type: object
                  nullable: true
                  description: Total commission actually billed so far
            annualized:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - type: object
                  nullable: true
                  description: Commission normalized to a 12-month period
            estimated:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - type: object
                  nullable: true
                  description: Estimated total commission for the current term
        _embedded:
          $ref: '#/components/schemas/ProducerBrokerCommissionDetail_Embedded'
        _links:
          $ref: '#/components/schemas/ProducerBrokerCommissionDetail_Links'
