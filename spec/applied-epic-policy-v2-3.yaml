    CreatePolicyLinePostPolicies:
      title: Line for Creating a Policy
      type: object
      description: Line object that is exclusively used as part of adding a new policy
      required:
        - status
        - lineType
        - issuingLocation
        - organization
        - billMode
      properties:
        status:
          type: string
          format: uuid
          description: Policy status identifier
        premium:
          type: object
          description: Premium information
          properties:
            estimated:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - description: Estimated total premium for the current term
                - type: object
                  properties:
                    units:
                      pattern: '^[1-9][0-9]*$'
        lineType:
          type: string
          format: uuid
          description: Line type identifier
        issuingCompany:
          type: string
          format: uuid
          description: Issuing company identifier
        issuingLocation:
          type: object
          description: Issuing location information
          required:
            - stateOrProvince
            - country
          properties:
            stateOrProvince:
              type: string
              description: 'The state or province code of the issuing location. This field will leverage ISO 3166-2 state code format (NY, ON)'
              maxLength: 2
            country:
              type: string
              description: 'The country code of the issuing location. This field will leverage ISO 3166-1 alpha-3 code format (USA, CAN, GBR)'
              maxLength: 3
        premiumPayable:
          type: object
          description: Premium payable information
          properties:
            account:
              type: string
              format: uuid
              description: Company or Broker Identifier for the premium payable
            type:
              type: string
              enum:
                - EXTERNAL_BROKER
                - CARRIER
                - INTERNAL_BROKER
              description: Premium payable entity type
        organization:
          type: string
          format: uuid
          description: Organization identifier
        billMode:
          type: string
          description: The bill mode for the line
          enum:
            - AGENCY
            - DIRECT
        agencyFirstWrittenOn:
          type: string
          format: date
          description: Date the agency first wrote the policy
        effectiveOn:
          type: string
          format: date
          description: Date the line is effective from
        expirationOn:
          type: string
          format: date
          description: Date the line expires
        planOptionName:
          type: string
          description: The plan option name
          maxLength: 100
        planLineId:
          type: string
          description: The identifier of the plan line
          maxLength: 25
        billTo:
          type: object
          description: Billing information pertaining to the line
          properties:
            contactName:
              type: string
              description: Bill to contact name
              maxLength: 100
            address:
              $ref: '#/components/schemas/Address'
            deliveryMethod:
              type: string
              enum:
                - MAIL
                - EMAIL
                - FAX
              description: Method the invoice is sent to recipient
            email:
              type: string
              description: Bill to Email
              maxLength: 250
              format: email
            faxNumber:
              $ref: '#/components/schemas/Fax'
            account:
              type: string
              format: uuid
              description: ID of the account
        newRevenueBeginOn:
          type: string
          format: date
          description: Date when new business revenue for this line begins
        renewalRevenueBeginOn:
          type: string
          format: date
          description: Date when renewal revenue for this line ends
    CreatePolicy:
      title: CreatePolicy
      type: object
      description: Request body for creating a new policy
      required:
        - description
        - effectiveOn
        - expirationOn
        - policyType
        - client
      properties:
        status:
          type: string
          description: Indicator of the high level status of the policy
          enum:
            - PROSPECTIVE
            - CONTRACTED
        description:
          type: string
          description: Short description of this policy
          maxLength: 125
        effectiveOn:
          type: string
          format: date
          description: Date when coverage for this policy becomes effective
        expirationOn:
          type: string
          format: date
          description: Date when coverage for this policy ends
        policyNumber:
          type: string
          description: Policy number as recorded on the policy
          maxLength: 25
        policyType:
          type: string
          format: uuid
          description: Unique identifier for the policy type
        client:
          type: string
          format: uuid
          description: Unique identifier of the client
        premium:
          type: object
          description: The total amount of money charged to the policyholder for insurance coverage over a specified term
          properties:
            estimated:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - description: The estimated total premium for this policy for the full term
                - type: object
                  properties:
                    units:
                      pattern: '^[1-9][0-9]*$'
            annualized:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - description: The premium for this policy expressed as an annual amount
                - type: object
                  properties:
                    units:
                      pattern: '^[1-9][0-9]*$'
            billed:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - description: The premium that has actually been billed for this policy as of the last update
                - type: object
                  properties:
                    units:
                      pattern: '^[1-9][0-9]*$'
        commission:
          type: object
          description: 'The amount (or set of amounts) payable to an intermediary (agent, broker, or other producer) as compensation for placing or servicing the policy'
          properties:
            estimated:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - description: Estimated total commission for this policy for the full term
                - type: object
                  properties:
                    units:
                      pattern: '^[1-9][0-9]*$'
            annualized:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - description: Commission for this policy expressed as an annual amount
                - type: object
                  properties:
                    units:
                      pattern: '^[1-9][0-9]*$'
            billed:
              allOf:
                - $ref: '#/components/schemas/Currency'
                - description: Commission that has actually been billed/recognized for this policy
                - type: object
                  properties:
                    units:
                      pattern: '^[1-9][0-9]*$'
        source:
          type: string
          format: uuid
          description: 'Identifier for the policy source'
        turnOffPolicyDownload:
          type: boolean
          description: 'When true, disables carrier policy download for this policy'
        lines:
          type: array
          minItems: 1
          maxItems: 1
          description: Array of lines to be created. At this time, only a single line is supported during the initial policy creation. Please use the post lines endpoint to add additional lines to the policy.
          writeOnly: true
          items:
            $ref: '#/components/schemas/CreatePolicyLinePostPolicies'
