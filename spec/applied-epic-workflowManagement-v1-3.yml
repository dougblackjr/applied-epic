                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          notes:
                            type: array
                            items:
                              type: object
                              allOf:
                                - $ref: '#/components/schemas/ActivityNote'
                                - $ref: '#/components/schemas/HALobject'
              examples:
                List Notes Response:
                  value:
                    total: 10
                    _links:
                      self:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/00000000-0000-0000-0000-000000000000/notes?offset=10&limit=2'
                      prev:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/00000000-0000-0000-0000-000000000000/notes?offset=8&limit=2'
                      next:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/00000000-0000-0000-0000-000000000000/notes?offset=12&limit=2'
                      first:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/00000000-0000-0000-0000-000000000000/notes?limit=2'
                      last:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/00000000-0000-0000-0000-000000000000/notes?offset=18&limit=2'
                    _embedded:
                      notes:
                        - id: '00000000-0000-0000-0000-000000000000'
                          accessLevel:
                            id: '6'
                            description: General
                          content: Client is not a good candidate for increasing coverage
                          enteredBy:
                            userCode: JDOE
                            date: '2021-01-05T02:03:04Z'
                          _links:
                            self:
                              href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/notes/00000000-0000-0000-0000-000000000000'
                        - id: '00000000-0000-0000-0000-000000000001'
                          content: Customer called looking for an update on upcoming renewal
                          enteredBy:
                            userCode: ACSR
                            date: '2022-03-04T02:03:04Z'
                          _links:
                            self:
                              href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/notes/00000000-0000-0000-0000-000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - oAuth:
          - 'epic/activity:read'
          - 'epic/activity:all'      
      operationId: get-activities-activityId-notes
      description: Retrieve a list of notes for an activity
    post:
      summary: POST a note on an activity
      operationId: post-activities-activityId-notes
      description: Create a new note on an activity
      tags:
        - Activities
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ActivityNote'
            examples:
              ActivityNoteRequestExample:
                value:
                  accessLevel:
                    id: '2'
                    description: Benfits
                  content: Client is not a good candidate for increasing coverage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityNote'
              examples:
