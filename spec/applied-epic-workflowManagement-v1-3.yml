openapi: 3.0.3
info:
  title: Workflow Management Module
  version: '1.0.5'
  description: Manage activities for work tracking purposes
servers:
  - url: 'https://api.mock.myappliedproducts.com/workflow-management/v1'
paths:
  '/clients/{clientId}/activities':
    get:
      summary: Get Client Activities
      operationId: get-clients-clientid-activities
      description: Retrieve a collection of activities associated to a client. Includes non system and system activities.
      tags:
        - Activities
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ClientCorrelationId'
        - $ref: '#/components/parameters/CultureCode'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/EnteredByDate'
        - $ref: '#/components/parameters/EnteredByDate_before'
        - $ref: '#/components/parameters/EnteredByDate_after'
        - $ref: '#/components/parameters/OwnerEmployeeId'
        - $ref: '#/components/parameters/OwnerWorkGroupId'
        - $ref: '#/components/parameters/AssociatedPolicyId'
        - $ref: '#/components/parameters/IndioSubmissionId'
      responses:
        '200':
          description: Activity Found
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HALcollection'
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          activities:
                            type: array
                            items:
                              type: object
                              allOf:
                                - $ref: '#/components/schemas/ActivityList'
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      $ref: '#/components/schemas/HALlink'
              examples:
                activityListResponseExample:
                  value:
                    total: 10
                    _links:
                      self:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/clients/00000000-0000-0000-0000-000000000000/activities?offset=10&limit=2'
                      prev:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/clients/00000000-0000-0000-0000-000000000000/activities?offset=8&limit=2'
                      next:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/clients/00000000-0000-0000-0000-000000000000/activities?offset=12&limit=2'
                      first:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/clients/00000000-0000-0000-0000-000000000000/activities?limit=2'
                      last:
                        href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/clients/00000000-0000-0000-0000-000000000000/activities?offset=18&limit=2'
                    _embedded:
                      activities:
                        - id: 00000000-0000-0000-0000-000000000000
                          code: CALL
                          description: Call the insured
                          associationType: POLICY
                          owner:
                            type: EMPLOYEE
                            id: 00000000-0000-0000-0000-000000000000
                            code: SMIMI1
                            name: Mike Smith
                          enteredBy:
                            userCode: JDOE
                            date: '2021-01-05'
                          lastUpdatedBy:
                            userCode: JDOE
                            date: '2021-07-05'
                          startFollowUpOn: '2021-03-15T13:00:00Z'
                          endFollowUpOn: '2021-07-05'
                          status: OPEN
                          _links:
                            self:
                              href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/00000000-0000-0000-0000-000000000000'
                        - id: 00000000-0000-0000-0000-000000000001
                          code: ATCH
                          description: File Attached
                          associationType: LINE
                          owner:
                            type: EMPLOYEE
                            id: 00000000-0000-0000-0000-000000000000
                            code: SMIMI1
                            name: Mike Smith
                          enteredBy:
                            userCode: JDOE
                            date: '2021-03-15T13:00:00Z'
                          lastUpdatedBy:
                            userCode: JDOE
                            date: '2022-01-25T13:48:00Z'
                          startFollowUpOn: '2021-03-15T13:00:00Z'
                          endFollowUpOn: '2021-07-05T13:00:00Z'
                          status: OPEN
                          _links:
                            self:
                              href: 'https://api.mock.myappliedproducts.com/workflow-management/v1/activities/00000000-0000-0000-0000-000000000001'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - oAuth:
          - 'epic/activity:read'
          - 'epic/activity:all'      
  /activities:
    post:
      summary: Create a non system generated Activity
      operationId: create-activity
      description: Create a new non system generated activity
      tags:
        - Activities
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Activity'
                - type: object
                  properties:
                    note:
                      $ref: '#/components/schemas/ActivityNote'
            examples:
              ActivityRequestExample:
                value:
                  code:
                    id: 00000000-0000-0000-0000-000000000000
                  description: Call the insured RE increasing coverage
                  association:
                    type: CLIENT
                    id: 00000000-0000-0000-0000-000000000000
                    organization:
                      agency:
                        id: 00000000-0000-0000-0000-000000000000
                      branch:
                        id: 00000000-0000-0000-0000-000000000000
                  owner:
                    type: EMPLOYEE
                    id: 00000000-0000-0000-0000-000000000000
                  startFollowUpOn: '2021-03-15T13:00:00Z'
                  endFollowUpOn: '2021-03-15T14:00:00Z'
                  followUpReminderOn: '2021-07-05T15:00:00Z'
                  issuingCompany:
                    id: 00000000-0000-0000-0000-000000000000
                  premiumPayable:
                    type: BROKER_INTERNAL
                    id: 00000000-0000-0000-0000-000000000000
                  status: CLOSED
                  closed:
                    successful: false
                    unsuccessfulReason: Never Contacted
                  note:
                    accessLevel:
                      id: '2'
                      description: Benfits
                    content: Client is not a good candidate for increasing coverage
      responses:
        '201':
          description: Created
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Activity'
                  - $ref: '#/components/schemas/HALobject'
                properties:
                  _links:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/HALlink'
                      association:
                        $ref: '#/components/schemas/HALlink'
              examples:
                ActivityResponseExample:
                  value:
                    id: 00000000-0000-0000-0000-000000000000
                    account:
                      id: 00000000-0000-0000-0000-000000000000
                      type: CLIENT
                      lookupCode: SMITALI-01
                      name: Alice Smith
                    association:
                      type: POLICY
                      id: 00000000-0000-0000-0000-000000000000
                    code:
                      id: 00000000-0000-0000-0000-000000000000
                      code: CALL
                    activityCode:
                      id: '65536'
                      code: CALL
                    description: Call the insured RE increasing coverage
                    owner:
                      type: EMPLOYEE
                      id: 00000000-0000-0000-0000-000000000000
                      code: SMIMI1
                      name: Mike Smith
                    enteredBy:
                      userCode: JDOE
                      date: '2021-01-05'
                    lastUpdatedBy:
                      userCode: JDOE
                      date: '2021-07-05'
                    startFollowUpOn: '2021-03-15T13:00:00Z'
                    endFollowUpOn: '2021-07-05'
                    status: CLOSED
                    closed:
                      successful: false
                      unsuccessfulReason: Never Contacted
                    _links:
                      self:
                        href: 'https://api.mock.myappliedproducts.com/activities/00000000-0000-0000-0000-000000000001'                      
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - oAuth:
          - 'epic/activity:write' 
          - 'epic/activity:all'
  '/activities/{activityId}':
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      summary: Get Activity by Activity ID
      operationId: get-activities-activityId
      description: Retrieve the information of an activity with the matching activity ID.
      tags:
        - Activities
      parameters:
        - $ref: '#/components/parameters/ClientCorrelationId'
        - $ref: '#/components/parameters/CultureCode'
      responses:
        '200':
          description: Activity Found
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Activity'
                  - $ref: '#/components/schemas/HALobject'
                properties:
                  _links:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/HALlink'
                      association:
                        $ref: '#/components/schemas/HALlink'
              examples:
                ActivityResponseExample:
                  $ref: '#/paths/~1activities/post/responses/201/content/application~1hal%2Bjson/examples/ActivityResponseExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - oAuth:
          - 'epic/activity:read'
          - 'epic/activity:all'      
  '/activities/{activityId}/notes':
    parameters:
      - schema:
          type: string
        name: activityId
        in: path
        required: true
    get:
      summary: Get notes for an activity by activity ID
