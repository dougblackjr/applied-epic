          - CARRIER_SUBMISSION
          - SERVICES
          - POLICY
    Activity:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: object
          description: The activity code assigned to the activity. Use the GET Activity Codes call to retrieve a list of activity codes that can be used to POST an activity
          properties:
            id:
              type: string
              description: The id of the activity code
            code:
              type: string
              description: The activity code
              readOnly: true
        activityCode:
          type: object
          deprecated: true
          description: The activity code assigned to the activity. Use the GET Activity Codes call to retrieve a list of activity codes that can be used to POST an activity
          properties:
            id:
              type: string
              deprecated: true
              description: The id of the activity code
            code:
              type: string
              deprecated: true
              description: The activity code
              readOnly: true
        description:
          type: string
          description: 'The activity''s description. To use the default from the activity code when adding an activity, provide the detail value returned in the Get Activity Codes call for the selected activity code. Activity description macro variables will not be resolved when adding an activity.'
        account:
          title: Account
          description: The account that the activity is associated to
          type: object
          readOnly: true
          properties:
            type:
              type: string
              description: The type of account
              enum:
                - BROKER
                - CLIENT
                - COMPANY
                - EMPLOYEE
                - FINANCE_COMPANY
                - OTHER_INTEREST
                - VENDOR
            id:
              type: string
              description: The identifier of the account
            lookupCode:
              type: string
              description: The account's lookup code
            name:
              type: string
              description: The name of the account
        association:
          title: Association
          description: The item that the activity is associated to
          type: object
          properties:
            type:
              $ref: '#/components/schemas/ItemTypeEnum'
            id:
              type: string
              description: The identifier of the item that the activity is associated to
            organization:
              $ref: '#/components/schemas/Organization'
        owner:
          title: owner
          type: object
          description: 'The owner of the activity. Use the GET Employee Owners and GET Work Group Owners calls to retrieve a list of valid values that can be provided when adding an activity. On POST if the owner is not provided then the value configured for the activity code will be used. If no value is configured for the activity code and no value is provided, then a validation error will be returned.'
          properties:
            type:
              type: string
              description: The type of owner
              enum:
                - EMPLOYEE
                - WORK_GROUP
            id:
              description: The identifier of the owner
              type: string
            code:
              type: string
              description: 'The lookup code if the owner is an employee, or the code if the owner is a work group'
              readOnly: true
            name:
              type: string
              description: The name of the owner
              readOnly: true
