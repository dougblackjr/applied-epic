  '/activities/codes/{activityCodeId}/defaults':
    parameters:
      - $ref: '#/components/parameters/ActivityCodeId'
    post:
      summary: Get Activity Code Defaults
      operationId: post-activities-codes-activityCodeId-default
      description: Retrieve the default values for an activity code based on the activity code ID. Returns values that can be used directly when creating an activity. Macro variables in the description will be resolved based on the provided association context.
      tags:
        - Activities
      parameters:
        - $ref: '#/components/parameters/ClientCorrelationId'
        - $ref: '#/components/parameters/CultureCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - association
              properties:
                association:
                  type: object
                  description: The item that the activity will be associated to. Required to resolve macro variables.
                  required:
                    - type
                    - id
                  properties:
                    type:
                      $ref: '#/components/schemas/ItemTypeEnum'
                    id:
                      type: string
                      description: The unique identifier of the item that the activity is associated to. If an account is provided, this resource must belong to that account.
                    organization:
                      type: string
                      description: The organization that will be associated to the activity. Use the agency and branch combination for the desired activity association.
                account:
                  type: string
                  description: The account that the activity is associated to. The account provided here must align with the association.
            examples:
              ActivityCodeDefaultRequestExample:
                value:
                  association:
                    type: ATTACHMENT
                    id: f034e97f-991e-48ed-b632-9ca67a953bf5
                    organization: ffd743ad-fabf-4f4a-8b9d-249ae5c43fa5
                  account: df132a65-eead-402c-b05e-8f821aa95754
      responses:
        '200':
          description: Activity Code Defaults Retrieved
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  code:
                    type: object
                    description: The activity code
                    properties:
                      id:
                        type: string
                        description: The unique identifier of the activity code
                  owner:
                    type: object
                    description: The default owner for the activity code
                    properties:
                      type:
                        type: string
                        description: The default type of activity owner
                        enum:
                          - EMPLOYEE
                          - WORK_GROUP
                      id:
                        type: string
                        description: The unique identifier of the owner. Conditionally required when the default owner is Specific person or Specific Work Group.
                  description:
                    type: string
                    description: Description of the activity code with macro variables resolved based on the provided association context
                  association:
                    type: object
                    description: The item that the activity is associated to
                    properties:
                      type:
                        $ref: '#/components/schemas/ItemTypeEnum'
                      id:
                        type: string
                        description: The unique identifier of the item that the activity is associated to
                      organization:
                        type: object
                        description: The organization that will be associated to the activity
                        properties:
                          agency:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique identifier of the agency belonging to the organization structure
                          branch:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique identifier of the branch belonging to the organization structure
                  status:
                    type: string
                    description: The default activity status assigned to the activity code
                    enum:
                      - OPEN
                      - CLOSED
                  closed:
                    type: object
                    description: The default closed details when the activity is closed on creation
                    properties:
                      successful:
                        type: boolean
                        description: The default assigned status when the activity is closed
                      unsuccessfulReason:
                        type: string
                        description: The default reason that will be associated with activity when closed unsuccessfully
                  startFollowUpOn:
                    type: string
                    description: The follow up start date and time. Returns empty string as this needs to be set by the caller.
                  endFollowUpOn:
                    type: string
                    description: The follow up end date and time. Returns empty string as this needs to be set by the caller.
                  followUpReminderOn:
                    type: string
                    description: The follow up reminder date and time. Returns empty string as this needs to be set by the caller.
                  issuingCompany:
                    type: object
                    nullable: true
                    description: The issuing company for the activity. Returns null as this needs to be set by the caller.
                  premiumPayable:
                    type: object
                    nullable: true
                    description: The premium payable entity for the activity. Returns null as this needs to be set by the caller.
                  note:
                    type: object
                    nullable: true
                    description: A note to be included when adding an activity. Returns null as this needs to be set by the caller.
              examples:
                ActivityCodeDefaultResponseExample:
                  value:
                    code:
                      id: 00000000-0000-0000-0000-000000000000
                    owner:
                      type: EMPLOYEE
                      id: 00000000-0000-0000-0000-000000000001
                    description: Call Alice Smith regarding policy renewal
                    association:
                      type: ATTACHMENT
                      id: f034e97f-991e-48ed-b632-9ca67a953bf5
                      organization:
                        agency:
                          id: 00000000-0000-0000-0000-000000000002
                        branch:
                          id: 00000000-0000-0000-0000-000000000003
                    status: OPEN
                    closed:
                      successful: true
                    startFollowUpOn: ''
                    endFollowUpOn: ''
                    followUpReminderOn: ''
                    issuingCompany: null
                    premiumPayable: null
                    note: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - oAuth:
          - 'epic/activity:write' 
          - 'epic/activity:all'         
