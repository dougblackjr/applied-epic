openapi: 3.0.3
info:
  title: Accounts
  version: '1.0.2'
  description: Access to top level accounts. These APIs are to be used in support of other resources, such as Attachments
servers:
  - url: 'https://api.mock.myappliedproducts.com/epic/account/v1'
tags:
  - name: Accounts
    description: Operations related to accounts
  - name: Relationships
    description: Operations related to account relationships
  - name: Agency Defined Categories
    description: Operations related to agency defined categories for accounts
paths:
  /accounts:
    get:
      summary: Get Accounts
      description: Get a list of accounts
      tags:
        - Accounts
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HALcollection'
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          accounts:
                            x-stoplight:
                              id: j2dyevjd94yo7
                            type: array
                            items:
                              x-stoplight:
                                id: rlauimc09nthj
                              allOf:
                                - $ref: '#/components/schemas/Account'
                                - $ref: '#/components/schemas/HALobject'
              examples:
                getResponse:
                  value:
                    total: 10
                    _links:
                      self:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts?offset=2&limit=2'
                      prev:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts?offset=1&limit=2'
                      next:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts?offset=3&limit=2'
                      first:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts?limit=2'
                      last:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts?offset=4&limit=2'
                    _embedded:
                      accounts:
                        - id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                          type: CLIENT
                          name: John Doe
                          lookupCode: JDOE-01
                          active: true
                          _links:
                            self:
                              href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/497f6eca-6276-4993-bfeb-53cbbbba6f08'
                        - id: 03de6e6d-7d02-4ef4-aea4-dcfc4f9709da
                          type: EMPLOYEE
                          name: Jane Doe
                          lookupCode: JADOE-01
                          active: true
                          _links:
                            self:
                              href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/03de6e6d-7d02-4ef4-aea4-dcfc4f9709da'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/FailedPrecondition'
      operationId: get-accounts
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - schema:
            type: string
          in: query
          name: name
          description: Finds accounts by their account name.
        - schema:
            type: string
          in: query
          name: name_contains
          description: Finds accounts that contains this value in their account name.
        - schema:
            type: string
          in: query
          name: lookupCode
          description: Finds accounts by lookup code.
        - schema:
            type: string
          in: query
          name: lookupCode_contains
          description: Finds accounts whose lookup code contains this value.
        - schema:
            type: string
            enum:
              - BROKER
              - CLIENT
              - COMPANY
              - EMPLOYEE
              - FINANCE_COMPANY
              - OTHER_INTEREST
              - VENDOR
          in: query
          name: type
          description: Finds account by type.
        - $ref: '#/components/parameters/CultureCode'
        - schema:
            type: string
            default: active
            example: 'active,inactive'
          in: query
          name: active_status
          description: Filters attachments by active (true) or inactive (false) status
        - schema:
            type: string
          in: query
          name: search
          description: Finds accounts that contain this value in either the lookup code or account name.
      security:
        - oAuth:
            - 'epic/accounts:read'
            - 'epic/accounts:all'
  '/accounts/{accountId}':
    parameters:
      - schema:
          type: string
        name: accountId
        description: The unique identifier (GUID) for the account
        in: path
        required: true
    get:
      summary: Get Account by ID
      description: Get details of an account by its unique identifier
      tags:
        - Accounts
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Account'
                  - $ref: '#/components/schemas/HALobject'
              examples:
                getSpecificResponse:
                  $ref: '#/components/examples/getResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'
      operationId: get-accounts-accountId
      parameters:
        - $ref: '#/components/parameters/CultureCode'
      security:
        - oAuth:
            - 'epic/accounts:read'
            - 'epic/accounts:all'
  /accounts/search:
    get:
      summary: Search Accounts
      tags:
        - Accounts
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HALcollection'
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          accounts:
                            x-stoplight:
                              id: j2dyevjd94yo7
                            type: array
                            description: List of accounts the search found
                            items:
                              x-stoplight:
                                id: rlauimc09nthj
                              allOf:
                                - allOf:
                                    - $ref: '#/components/schemas/Account'
                                    - type: object
                                      x-stoplight:
                                        id: n0u8xjygrjzfl
                                      properties:
                                        matchedResults:
                                          type: array
                                          x-stoplight:
                                            id: 18qn0hoplu5ux
                                          description: List of results that triggered the match
                                          items:
                                            x-stoplight:
                                              id: rwxadb6e9f1b2
                                            allOf:
                                              - type: object
                                                properties:
                                                  id:
                                                    type: string
                                                    x-stoplight:
                                                      id: brk3qt37yvo73
                                                    format: uuid
                                                    description: Unique identifier of the resource that matched
                                                    readOnly: true
                                                  type:
                                                    x-stoplight:
                                                      id: xkzk1ovteh5tr
                                                    enum:
                                                      - BROKER
                                                      - CLIENT
                                                      - COMPANY
                                                      - EMPLOYEE
                                                      - FINANCE_COMPANY
                                                      - OTHER_INTEREST
                                                      - VENDOR
                                                      - CONTACT
                                                    description: Type of resource that was matched
                                                    readOnly: true
                                                  phoneNumbers:
                                                    type: array
                                                    x-stoplight:
                                                      id: 2tbkm69etz05a
                                                    description: Details of the phone numbers that matched the search criteria. Optionally incuded with expand query parameter.
                                                    items:
                                                      type: object
                                                      properties:
                                                        number:
                                                          description: The primary part of the phone number in the standard E.164 format
                                                          type: string
                                                          maxLength: 16
                                                          format: e164
                                                        extension:
                                                          type: string
                                                          description: A secondary part of the phone number used in organizations to route calls to specific internal lines or departments
                                                          maxLength: 6
                                                          pattern: '[\d\,]*'
                                                        type:
                                                          type: string
                                                          description: Indicates the type of phone number
                                                          enum:
                                                            - BUSINESS
                                                            - MOBILE
                                                            - RESIDENCE
                                                            - FAX
                                                            - OTHER
                                                            - ACCOUNT
                                                        description:
                                                          type: string
                                                          description: The description of the phone number
                                                          maxLength: 70
                                                        callPermission:
                                                          type: string
                                                          description: Indicates if permission to call the phone number has been obtained
                                                          enum:
                                                            - OBTAINED
                                                            - DID_NOT_OBTAIN
                                                            - PLEASE_DO_NOT_CALL
                                                  emails:
                                                    type: array
                                                    x-stoplight:
                                                      id: tpw5saimusvv1
                                                    description: Details of the email addresses that matched the search criteria. Optionally incuded with expand query parameter.
                                                    items:
                                                      type: object
                                                      properties:
                                                        emailAddress:
                                                          type: string
                                                          format: email
                                                          description: The email address
                                                          maxLength: 60
                                              - $ref: '#/components/schemas/HALobject'
                                    - $ref: '#/components/schemas/HALobject'
              examples:
                searchResponse:
                  value:
                    total: 10
                    _links:
                      self:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/search?offset=2&limit=2&email=user@domain.com&phoneNumber=+15555555555'
                      prev:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/search?offset=1&limit=2&email=user@domain.com&phoneNumber=+15555555555'
                      next:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/search?offset=3&limit=2&email=user@domain.com&phoneNumber=+15555555555'
                      first:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/search?limit=2&email=user@domain.com&phoneNumber=+15555555555'
                      last:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/search?offset=4&limit=2&email=user@domain.com&phoneNumber=+15555555555'
                    _embedded:
