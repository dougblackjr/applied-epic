components:
  schemas:
    Account:
      title: Account
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier (GUID) that represents the account
          readOnly: true
        type:
          enum:
            - BROKER
            - CLIENT
            - COMPANY
            - EMPLOYEE
            - FINANCE_COMPANY
            - OTHER_INTEREST
            - VENDOR
          description: The type of account
          readOnly: true
        name:
          type: string
          maxLength: 100
          description: Name of the account.
        lookupCode:
          type: string
          description: Lookup code of the account.
          maxLength: 10
        active:
          type: boolean
          x-stoplight:
            id: mx17ax3v6v2xc
          description: Indicates whether the account is active or inactive
    Relationship:
      title: Relationship
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier (GUID) that represents the relationship
          readOnly: true
        type:
          type: string
          maxLength: 101
          description: Name of the relationship type as configured in Epic
          example: Parent/Child
        primaryRole:
          type: string
          maxLength: 50
          description: Name of the role assigned to the first party in the relationship
          example: Parent
        secondaryRole:
          type: string
          maxLength: 50
          description: Name of the role assigned to the second party in the relationship
          example: Child
        active:
          type: boolean
          description: Indicates whether the relationship is active or inactive
    AccountRelationship:
      title: AccountRelationship
      type: object
      description: Represents a relationship from the perspective of a specific account
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier (GUID) that represents the relationship
          readOnly: true
        relatedAccount:
          type: string
          format: uuid
          description: The unique identifier (GUID) of the related account
          readOnly: true
        type:
          type: string
          format: uuid
          description: The unique identifier (GUID) of the relationship type
          readOnly: true
        role:
          type: string
          maxLength: 50
          description: The role of the related account in this relationship
          example: Child
          readOnly: true
        active:
          type: boolean
          description: Indicates whether the relationship is active or inactive
          readOnly: true
    HALobject:
      title: HALobject
      type: object
      properties:
        _links:
          type: object
          description: Related links
          additionalProperties:
            $ref: '#/components/schemas/HALlink'
        _embedded:
          type: object
    Error:
      title: Error
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
        additionalDetails:
          type: array
          items:
            type: object
      description: Common error response
    HALlink:
      title: HALlink
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
        type:
          type: string
        deprecation:
          type: string
        name:
          type: string
        profile:
          type: string
        title:
          type: string
        hreflang:
          type: string
    HALcollection:
      title: HALcollection
      type: object
      properties:
        total:
          type: integer
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/HALlink'
            prev:
              $ref: '#/components/schemas/HALlink'
            next:
              $ref: '#/components/schemas/HALlink'
            first:
              $ref: '#/components/schemas/HALlink'
            last:
              $ref: '#/components/schemas/HALlink'
        _embedded:
          type: object
    UserAndDate:
      title: UserAndDate
      type: object
      readOnly: true
      properties:
        userCode:
          type: string
          description: The user code that performed the action
        date:
          type: string
          format: date-time
          description: When the action was performed
    ProcessAndDate:
      title: ProcessAndDate
      type: object
      readOnly: true
      properties:
        code:
          type: string
          description: The process code that performed the action
        date:
          type: string
          format: date-time
          description: When the action was performed
    AgencyDefinedCategory:
      title: AgencyDefinedCategory
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier (GUID) that represents the agency defined category.
        category:
          type: string
          description: A classification label defined by the agency to group related entities for reporting or workflow purposes.
        option:
          type: string
          description: A value within a category that further specifies the classification.
        enteredBy:
          $ref: '#/components/schemas/UserAndDate'
        enteredByProcess:
          $ref: '#/components/schemas/ProcessAndDate'
  responses:
