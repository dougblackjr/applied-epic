                                  description: Work phone
                                  callPermission: OBTAINED
                              _links:
                                self:
                                  href: 'https://api.mock.myappliedproducts.com/epic/client/v1/clients/03de6e6d-7d02-4ef4-aea4-dcfc4f9709da'
                          _links:
                            self:
                              href: 'https://api.mock.myappliedproducts.com/epic/client/v1/clients/03de6e6d-7d02-4ef4-aea4-dcfc4f9709da'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/FailedPrecondition'
      operationId: search-accounts
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - schema:
            type: string
            format: e164
            example: '+15551234567'
            maxLength: 16
          in: query
          name: phoneNumber
          description: Finds accounts where the phone number belongs to the account or contact
        - schema:
            type: string
            example: '+15551234567'
            maxLength: 16
          in: query
          name: phoneNumber_contains
          description: Finds accounts where that contain the phone number in the account or contact
        - schema:
            type: string
            enum:
              - BROKER
              - CLIENT
              - COMPANY
              - EMPLOYEE
              - FINANCE_COMPANY
              - OTHER_INTEREST
              - VENDOR
          in: query
          name: type
          description: Finds account by type.
        - $ref: '#/components/parameters/CultureCode'
        - schema:
            type: string
            format: email
          in: query
          name: email
          description: Finds accounts where the email belongs to the account or contact
        - schema:
            type: string
          in: query
          name: email_contains
          description: Finds accounts where that contain the email in the account or contact
        - schema:
            type: array
            items:
              type: string
              enum:
                - matchedResults
          style: form
          explode: false
          in: query
          name: expand
          description: Additional fields to be added to the response
      security:
        - oAuth:
            - 'epic/accounts:search'
            - 'epic/accounts:all'
      description: Used to search across accounts. One of phone number or email search must be provided to recieve any results.
  '/accounts/{accountId}/relationships':
    parameters:
      - schema:
          type: string
          format: uuid
        name: accountId
        in: path
        required: true
        description: The unique identifier (GUID) for the account
    get:
      summary: Get Relationships by Account ID
      description: Get Relationships by Account ID. This method requires version May 2026 of Epic or later to be utilized.
      tags:
        - Relationships
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HALcollection'
                  - type: object
                    properties:
                      _embedded:
                        type: object
                        properties:
                          relationships:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/AccountRelationship'
                                - type: object
                                  properties:
                                    _embedded:
                                      type: object
                                      properties:
                                        relatedAccount:
                                          $ref: '#/components/schemas/Account'
                                        type:
                                          $ref: '#/components/schemas/Relationship'
              examples:
                getRelationshipsResponse:
                  value:
                    total: 2
                    _links:
                      self:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/497f6eca-6276-4993-bfeb-53cbbbba6f08/relationships?offset=0&limit=100'
                      first:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/497f6eca-6276-4993-bfeb-53cbbbba6f08/relationships?limit=100'
                      last:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/497f6eca-6276-4993-bfeb-53cbbbba6f08/relationships?offset=0&limit=100'
                    _embedded:
                      relationships:
                        - id: 13f84f7e-6ad4-4ef0-86bd-8cee00cb8576
                          relatedAccount: 03de6e6d-7d02-4ef4-aea4-dcfc4f9709da
                          type: a9b8c7d6-e5f4-3210-fedc-ba0987654321
                          role: Child
                          active: true
                        - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                          relatedAccount: d723febc-61f0-4600-8f53-922799a058fd
                          type: b2c3d4e5-f6a7-8901-bcde-f12345678901
                          role: Employee
                          active: true
                getRelationshipsWithEmbedResponse:
                  value:
