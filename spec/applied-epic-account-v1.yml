      operationId: get-relationships-by-accountid
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CultureCode'
        - schema:
            type: string
            format: uuid
          in: query
          name: relatedAccount
          description: Filters relationships by the related account's unique identifier (GUID).
        - schema:
            type: string
            format: uuid
          in: query
          name: type
          description: Filters relationships by the relationship type's unique identifier (GUID).
        - schema:
            type: string
          in: query
          name: role
          description: Filters relationships by the role name.
        - schema:
            type: string
          in: query
          name: role_contains
          description: Filters relationships where the role contains this value.
        - schema:
            type: string
            default: active
            example: 'active,inactive'
          in: query
          name: active_status
          description: Filters account relationships by active (true) or inactive (false) status
        - schema:
            type: array
            items:
              type: string
              enum:
                - relatedAccount
                - type
          style: form
          explode: false
          in: query
          name: embed
          description: Embed additional resources in the response.
      security:
        - oAuth:
            - 'epic/account-relationships:read'
            - 'epic/account-relationships:all'
  '/relationships/{relationshipId}':
    parameters:
      - schema:
          type: string
        name: relationshipId
        in: path
        required: true
        description: The unique identifier (GUID) for the relationship
    get:
      summary: Get Relationship by ID
      description: Get relationship by ID. This method requires version Fall 2022 of Epic or later to be utilized.
      tags:
        - Relationships
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Relationship'
                  - $ref: '#/components/schemas/HALobject'
              examples:
                getSpecificResponse:
                  $ref: '#/components/examples/getResponseForRelationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
      operationId: get-relationship-byId
      parameters:
        - $ref: '#/components/parameters/CultureCode'
      security:
        - oAuth:
            - 'epic/relationships:read'
            - 'epic/relationships:all'
  '/accounts/{accountId}/agency-defined-categories':
    parameters:
      - schema:
          type: string
          format: uuid
        name: accountId
        in: path
        required: true
        description: 'Unique Id of the Account. Note: At this time only CLIENT account types (Client.ClientId) are supported. All other account types will return a 404 error.'
    get:
      summary: Get Agency Defined Categories for Account
      description: 'Get list of agency defined categories for an account. This method requires version May 2026 of Epic or later to be utilized. **Important:** At this time only CLIENT account types are supported. Passing an accountId for any other account type (BROKER, COMPANY, EMPLOYEE, etc.) will return a 404 error.'
      operationId: get-accounts-accountId-agency-defined-categories
      tags:
        - Agency Defined Categories
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
