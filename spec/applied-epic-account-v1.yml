                    _links:
                      self:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/497f6eca-6276-4993-bfeb-53cbbbba6f08/relationships?offset=0&limit=100&embed=relatedAccount,type'
                      first:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/497f6eca-6276-4993-bfeb-53cbbbba6f08/relationships?limit=100&embed=relatedAccount,type'
                      last:
                        href: 'https://api.mock.myappliedproducts.com/epic/account/v1/accounts/497f6eca-6276-4993-bfeb-53cbbbba6f08/relationships?offset=0&limit=100&embed=relatedAccount,type'
                    _embedded:
                      relationships:
                        - id: 13f84f7e-6ad4-4ef0-86bd-8cee00cb8576
                          relatedAccount: 03de6e6d-7d02-4ef4-aea4-dcfc4f9709da
                          type: a9b8c7d6-e5f4-3210-fedc-ba0987654321
                          role: Child
                          active: true
                          _embedded:
                            relatedAccount:
                              id: 03de6e6d-7d02-4ef4-aea4-dcfc4f9709da
                              lookupCode: JADOE-01
                              type: CLIENT
                              name: Jane Doe
                              active: true
