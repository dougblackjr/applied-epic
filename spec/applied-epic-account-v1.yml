                          _links:
                            self:
                              href: 'https://api.mock.myappliedproducts.com/epic/client/v1/clients/497f6eca-6276-4993-bfeb-53cbbbba6f08'
                        - id: 03de6e6d-7d02-4ef4-aea4-dcfc4f9709da
                          type: CLIENT
                          name: Jane Doe
                          lookupCode: JADOE-01
                          active: true
                          matchedResults:
                            - id: d723febc-61f0-4600-8f53-922799a058fd
                              type: CONTACT
                              emails:
                                - emailAddress: user@domain.com
                              _links:
                                self:
                                  href: 'https://api.mock.myappliedproducts.com/epic/contact/v1/contacts/d723febc-61f0-4600-8f53-922799a058fd'
                            - id: 03de6e6d-7d02-4ef4-aea4-dcfc4f9709da
                              type: CLIENT
                              phoneNumbers:
                                - number: '+15555555555'
                                  extension: ''
                                  type: MOBILE
                                  description: Personal cell phone
                                  callPermission: OBTAINED
                                - number: '+15555555556'
                                  extension: '123'
